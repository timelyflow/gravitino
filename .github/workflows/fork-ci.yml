# Sandbox-only fast jobs; publisher scripts are the PR implementation with repository identity adapted.
name: Fork CI
run-name: "${{ github.event_name == 'workflow_dispatch' && format('Trusted Fork CI #{0}', inputs.pull-request) || format('Fork CI {0}', github.ref_name) }}"
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      pull-request:
        description: Sandbox PR number
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: sandbox-fork-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eligibility:
    name: Resolve fork CI eligibility
    if: vars.DISABLE_FORK_CI != 'true'
    runs-on: ubuntu-slim
    outputs:
      base-ref: ${{ steps.resolve.outputs.base-ref }}
      base-sha: ${{ steps.resolve.outputs.base-sha }}
      head-repository: ${{ steps.resolve.outputs.head-repository }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      sync: ${{ steps.resolve.outputs.sync }}
      valid: ${{ steps.resolve.outputs.valid == 'true' && (steps.resolve.outputs.sync != 'true' || steps.merge.outcome == 'success') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve one immutable test context
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/resolve-fork-ci.cjs').resolve({ github, context, core });

      - name: Check the frozen merge before starting suites
        id: merge
        if: steps.resolve.outputs.sync == 'true'
        env:
          BASE_SHA: ${{ steps.resolve.outputs.base-sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
          HEAD_REPOSITORY: ${{ steps.resolve.outputs.head-repository }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/merge-check"
          cd "${RUNNER_TEMP}/merge-check"
          git init --quiet
          git fetch --quiet --no-tags https://github.com/timelyflow/gravitino.git "${BASE_SHA}"
          git fetch --quiet --no-tags "https://github.com/${HEAD_REPOSITORY}.git" "${HEAD_SHA}"
          git merge-tree --write-tree --name-only "${BASE_SHA}" "${HEAD_SHA}"

  build:
    name: build / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - name: Controlled quick verdict
        env:
          FORCE_FAILURE: ${{ vars.CI_STATUS_E2E_FAIL_20261023 }}
        run: |
          echo "Controlled failure=$FORCE_FAILURE"
          sleep 20
          test "$FORCE_FAILURE" != 'true'
  backend:
    name: backend / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  spark:
    name: spark / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  flink:
    name: flink / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  trino:
    name: trino / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  iceberg_rest_trino:
    name: iceberg_rest_trino / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  python:
    name: python / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  frontend:
    name: frontend / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  access_control:
    name: access_control / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  idp_basic:
    name: idp_basic / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  mcp:
    name: mcp / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  maintenance:
    name: maintenance / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  web_ui:
    name: web_ui / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  charts:
    name: charts / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  contrib_catalog:
    name: contrib_catalog / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  asf_allowlist:
    name: asf_allowlist / fast-probe
    needs: eligibility
    if: needs.eligibility.outputs.valid == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - run: echo 'Fast caller probe passed'
  required:
    name: Required CI / ${{ needs.eligibility.outputs.base-ref }} / ${{ needs.eligibility.outputs.base-sha }} / ${{ needs.eligibility.outputs.head-sha }}
    if: always()
    needs: [eligibility, build, backend, spark, flink, trino, iceberg_rest_trino, python, frontend, access_control, idp_basic, mcp, maintenance, web_ui, charts, contrib_catalog, asf_allowlist]
    runs-on: ubuntu-slim
    timeout-minutes: 3
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'CHECK'
          import json, os
          results=json.loads(os.environ['RESULTS'])
          print({name: value['result'] for name,value in results.items()})
          assert all(value['result']=='success' for value in results.values())
          CHECK
