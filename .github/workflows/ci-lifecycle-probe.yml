name: CI lifecycle status probe
on:
  workflow_dispatch:
    inputs:
      pull-request:
        required: true
        type: string
permissions: {}
concurrency:
  group: fork-ci-status-update
  queue: max
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-slim
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      checks: write
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            context.eventName='schedule';
            await require('./.github/scripts/update-fork-ci.cjs').update({github,context,core});
