name: CI progress real API probe
on:
  workflow_dispatch:
    inputs:
      pull-request:
        required: true
        type: string
      mode:
        default: current
        type: string
permissions: {}
concurrency:
  group: fork-ci-status-update
  queue: max
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 6
    permissions:
      checks: write
      statuses: write
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const mode=context.payload.inputs.mode;
            if(mode==='schedule')context.eventName='schedule';
            const script=mode==='legacy'?'legacy-update.cjs':'update-fork-ci.cjs';
            await require('./.github/scripts/'+script).update({github,context,core});
