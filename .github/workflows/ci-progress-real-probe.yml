name: CI progress real API probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  check-reset:
    runs-on: ubuntu-slim
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const c = await github.rest.checks.create({...context.repo, name:'CI check reset probe', head_sha:context.sha, status:'completed', conclusion:'action_required', output:{title:'Initial terminal result', summary:'Test-only check'}});
            const reset = await github.rest.checks.update({...context.repo, check_run_id:c.data.id, status:'in_progress', conclusion:null});
            core.info(JSON.stringify({id:c.data.id,status:reset.data.status,conclusion:reset.data.conclusion,completed_at:reset.data.completed_at}));
            await github.rest.checks.update({...context.repo,check_run_id:c.data.id,status:'completed',conclusion:'success',output:{title:'API reset probe completed',summary:'Recorded the real API reset semantics.'}});
